loom.platform=forge
org.gradle.jvmargs=-Xmx2G
# Gradle 守护进程需要 Java 17+（Essential Loom 1.15 要求），游戏进程则自动解析 Java 8 工具链
# （编译 toolchain 与 runClient 的 launcher 均已配置为 Java 8，见 build.gradle.kts / settings.gradle.kts）。
# 无需在本文件指定任何 JDK 路径：工具链由 Foojay resolver 自动探测或下载。
org.gradle.java.installations.auto-download=true
baseGroup=adreno.myauclickgui
mcVersion=1.8.9
modid=MyauClickGui
version=1.0.0
